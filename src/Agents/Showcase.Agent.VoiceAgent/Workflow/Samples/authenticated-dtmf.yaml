name: authenticated-dtmf
version: 1
description: |
  Showcase port of AuthenticatedSampleWorkflows.BuildAuthenticatedDtmfWorkflow.
  Pure DTMF banking flow that gates self-service branches (balance, billing) on
  a successful PIN entry. The PIN is validated by the host-registered
  'pin-validator' tool, which elevates the caller's identity in the scoped
  CallerAuthenticationState.

strategy:
  primary: dtmf
  allowMidCallDegradation: false

base:
  prompt:
    role:
      identity: "ACME Bank IVR"
      objective: "Route callers to self-service or live agents."
    personality:
      personality: "calm, clear"
      tone: "warm"
  commonTools:
    - transfer-to-human
    - end-session
  requiredAuthLevel: none

stages:
  - id: welcome
    goal: "Greet the caller and present the main menu."
    description: "Welcome to ACME Bank."
    realtime:
      instructions:
        - "Greet the caller, then route by digit."
    scripted:
      onErrorPrompt: "Sorry, that isn't a valid option. Press 1 for balance, 2 for billing, or 0 for an agent."
      dtmf:
        ssmlPrompt: |
          <speak version="1.0" xmlns="http://www.w3.org/2001/10/synthesis" xml:lang="en-US">
            <voice name="en-US-Ava:DragonHDLatestNeural">
              <prosody rate="-5%">
                Welcome to ACME Bank.
                <break time="300ms"/>
                For account balance, press 1.
                <break time="200ms"/>
                For billing, press 2.
                <break time="200ms"/>
                To speak with an agent, press 0.
              </prosody>
            </voice>
          </speak>
        options:
          - { digit: '1', label: balance, nextStage: auth_pin }
          - { digit: '2', label: billing, nextStage: auth_pin }
          - { digit: '0', label: agent,   tool: transfer-to-agent }
    exitWhen: "Caller selects a menu option."

  - id: auth_pin
    goal: "Collect and validate the caller's PIN."
    description: "PIN entry"
    requires:
      - type: previousStage
        stage: welcome
    realtime:
      instructions:
        - "Prompt the caller for their four-digit PIN, then route based on the validator's result."
    scripted:
      onErrorPrompt: "That PIN doesn't match our records. Transferring you to an agent."
      dtmf:
        ssmlPrompt: |
          <speak version="1.0" xmlns="http://www.w3.org/2001/10/synthesis" xml:lang="en-US">
            <voice name="en-US-Ava:DragonHDLatestNeural">
              Please enter your four-digit PIN, followed by the pound key.
            </voice>
          </speak>
        collect:
          minDigits: 4
          maxDigits: 4
          terminator: '#'
          validator: pin-validator
          digitsParameterName: digits
          collectedStateKey: pinVerified
          onValidNextStage: balance_self_service
          onInvalidPrompt: "That PIN doesn't match our records. Transferring you to an agent."
    transitions:
      - to: balance_self_service
        onCondition: "PIN valid"
      - to: transfer_to_agent
        onCondition: "PIN invalid"

  - id: balance_self_service
    goal: "Read the verified caller their account balance."
    description: "Balance self-service"
    terminal: true
    requires:
      - type: auth
        level: multiFactor
    realtime:
      instructions:
        - "Caller is fully verified at this point. Read account balance and offer next actions."

  - id: transfer_to_agent
    goal: "Hand the caller to a live agent."
    description: "Agent transfer"
    terminal: true
    realtime:
      instructions:
        - "Tell the caller you're transferring them, then disconnect."
      tools:
        - transfer-to-agent
