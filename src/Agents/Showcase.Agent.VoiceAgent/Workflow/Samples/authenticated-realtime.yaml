name: authenticated-realtime
version: 1
description: |
  Voice-first ACME Bank concierge that greets the caller, walks them through
  two-factor verification (knowledge-based PIN + SMS one-time passcode), and
  then exposes a self-service balance lookup. The PIN step calls the host
  'confirm-identity' tool which elevates the caller to KnowledgeBased; the
  OTP step calls 'request-otp' to dispatch an SMS, then 'submit-otp' once the
  caller reads the digits back, elevating the caller to MultiFactor. The
  balance stage is guarded by an `auth: multiFactor` requirement so it is
  unreachable unless both factors have passed.

strategy:
  primary: realtime
  fallback:
    - nlu
    - dtmf
  prewarmTiers:
    - dtmf
  allowMidCallDegradation: true

base:
  prompt:
    role:
      identity: "ACME Bank concierge agent"
      objective: "Help callers with account inquiries after verifying identity."
    personality:
      personality: "warm, concise, professional"
      tone: "friendly and confident"
    context: "If the conversation context has a CallerName, address them by first name."
  commonTools:
    - transfer-to-human
    - end-session

stages:
  - id: welcome
    goal: "Greet the caller, capture their name, and collect their primary intent."
    realtime:
      instructions:
        - "Greet the caller warmly."
        - "If `CallerFullName` is already present in the Collected Information, address them by first name directly — do NOT ask again."
        - "Otherwise, ask the caller for their first and last name. Once they have clearly stated both, call the record-caller-name tool exactly once with the spoken values. After the tool returns success, thank them by first name."
        - "Then listen for the caller's intent: balance, billing, or agent transfer."
      examples:
        - "Welcome to ACME Bank. Before we get started, could I get your first and last name?"
        - "Thanks, Jordan. I can help with balances, billing, or transferring to a representative — what would you like to do?"
      tools:
        - record-caller-name
    scripted:
      dtmf:
        ssmlPrompt: |
          <speak version="1.0" xmlns="http://www.w3.org/2001/10/synthesis" xml:lang="en-US">
            <voice name="en-US-Ava:DragonHDLatestNeural">
              <prosody rate="-5%">
                Welcome to ACME Bank.
                <break time="300ms"/>
                For account balance, press 1.
                <break time="200ms"/>
                For billing, press 2.
                <break time="200ms"/>
                To speak with an agent, press 0.
              </prosody>
            </voice>
          </speak>
        options:
          - { digit: '1', label: balance, nextStage: verify }
          - { digit: '2', label: billing, nextStage: verify }
          - { digit: '0', label: agent,   nextStage: transfer }
    exitWhen: "Caller has stated their primary intent"
    transitions:
      - to: verify
        onCondition: "Caller wants account-specific information"
      - to: transfer
        onCondition: "Caller asked for an agent"

  - id: verify
    goal: "Confirm the caller's identity via PIN (knowledge factor)."
    description: "PIN verification (factor 1)"
    realtime:
      instructions:
        - "Politely ask the caller to say their four-digit PIN."
        - "When they say it, call the confirm-identity tool with the digits."
        - "On failure, ask once more, then offer to transfer to an agent."
      tools:
        - confirm-identity
    scripted:
      onErrorPrompt: "That PIN doesn't match our records. Transferring you to an agent."
      dtmf:
        ssmlPrompt: |
          <speak version="1.0" xmlns="http://www.w3.org/2001/10/synthesis" xml:lang="en-US">
            <voice name="en-US-Ava:DragonHDLatestNeural">
              Please enter your four-digit PIN, followed by the pound key.
            </voice>
          </speak>
        collect:
          minDigits: 4
          maxDigits: 4
          terminator: '#'
          validator: pin-validator
          digitsParameterName: digits
          collectedStateKey: pinVerified
          onValidNextStage: otp_verify
          onInvalidPrompt: "That PIN doesn't match our records. Transferring you to an agent."
    exitWhen: "PIN confirmed or transfer requested"
    transitions:
      - to: otp_verify
        onCondition: "PIN confirmed"
      - to: transfer
        onCondition: "PIN could not be confirmed"

  - id: otp_verify
    goal: "Complete MFA by sending an SMS one-time passcode and validating the caller's response."
    description: "SMS OTP verification (factor 2)"
    requires:
      - type: auth
        level: knowledgeBased
        message: "PIN verification must complete before sending an OTP."
    realtime:
      instructions:
        - "Tell the caller you are sending a six-digit code to the phone number on file."
        - "Call request-otp exactly once to dispatch the SMS."
        - "When the caller reads the digits back, call submit-otp with just the digits — do not invent or guess."
        - "On failure, allow one retry, then offer to transfer to an agent."
      tools:
        - request-otp
        - submit-otp
    scripted:
      onErrorPrompt: "That code doesn't match. Transferring you to an agent."
      dtmf:
        ssmlPrompt: |
          <speak version="1.0" xmlns="http://www.w3.org/2001/10/synthesis" xml:lang="en-US">
            <voice name="en-US-Ava:DragonHDLatestNeural">
              A six-digit code has been sent to your phone. Enter it followed by the pound key.
            </voice>
          </speak>
        collect:
          minDigits: 6
          maxDigits: 6
          terminator: '#'
          validator: submit-otp
          digitsParameterName: digits
          collectedStateKey: otpVerified
          onValidNextStage: balance
          onInvalidPrompt: "That code doesn't match. Transferring you to an agent."
    exitWhen: "OTP confirmed or transfer requested"
    transitions:
      - to: balance
        onCondition: "OTP confirmed"
      - to: transfer
        onCondition: "OTP could not be confirmed"

  - id: balance
    goal: "Read the verified caller their current account balance."
    description: "Verified balance self-service"
    requires:
      - type: auth
        level: multiFactor
        message: "Balance access requires multi-factor verification."
    realtime:
      instructions:
        - "Caller is fully verified at this point."
        - "Call lookup-balance and read back the available and pending amounts in a natural sentence (e.g. \"Your available balance is $8,421.33 with $125 pending\")."
        - "When they're done, ask if there's anything else; if not, hand off to closing."
      tools:
        - lookup-balance
    exitWhen: "Caller has heard their balance and has no more questions"
    onExit: closing

  - id: transfer
    goal: "Transfer the caller to a live agent."
    description: "Agent transfer"
    realtime:
      instructions:
        - "Acknowledge the request, set expectations on wait time, and complete the transfer."
        - "Use the transfer-to-agent tool with targetIdentifier set to the configured escalation number and transferKind 'phone'."
      tools:
        - transfer-to-agent
    exitWhen: "Transfer initiated"
    onExit: closing

  - id: closing
    goal: "Politely end the call."
    terminal: true
    realtime:
      instructions:
        - "Summarize what was accomplished and end the call."
      examples:
        - "Thanks for calling ACME Bank. Goodbye."

