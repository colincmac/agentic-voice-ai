name: authenticated-realtime
version: 2
description: |
  Voice-first ACME Bank concierge demonstrating Phase 3 per-transition auth
  requirements + authResolver detours. The parent workflow declares three options
  on `welcome`:
    * `balance`        — requires `auth: multiFactor`
    * `activate_card`  — requires `auth: knowledgeBased` (PIN only)
    * `transfer`       — no auth required
  The workflow-level `authResolvers:` block routes failing guards to reusable
  sub-workflows (`subflows.verify` for PIN, `subflows.verify-mfa` for OTP). The
  MFA subflow itself requires KBA, so when a caller hits `balance` starting from
  ANI-only, the navigator chains `welcome → subflows.verify (PIN) → subflows.verify-mfa
  (OTP) → balance` automatically. No verify / otp_verify stages live in this
  parent workflow.

strategy:
  primary: realtime
  fallback:
    - nlu
    - dtmf
  prewarmTiers:
    - dtmf
  allowMidCallDegradation: true

base:
  prompt:
    role:
      identity: "ACME Bank concierge agent"
      objective: "Help callers with account inquiries after verifying identity."
    personality:
      personality: "warm, concise, professional"
      tone: "friendly and confident"
    context: "If the conversation context has a CallerName, address them by first name."
  commonTools:
    - transfer-to-human
    - end-session

# Phase 3: every guard kind that can be auto-satisfied by pushing a sub-workflow.
# The navigator consults this list in order whenever a transition's `requires:` (or a
# target stage's stage-level `requires:`) fails. First match wins. The MFA resolver
# below references a sub-workflow that itself requires KBA, so chaining is automatic.
authResolvers:
  - guard: { type: auth, level: knowledgeBased }
    subflow: subflows.verify
  - guard: { type: auth, level: multiFactor }
    subflow: subflows.verify-mfa

# Workflow-default destination when a transition's guards can't be satisfied by any
# resolver chain (e.g. the caller fails PIN three times). Per-stage `onUnauthorized:`
# overrides this.
onUnauthorized: transfer

stages:
  - id: welcome
    goal: "Greet the caller, capture their name, and collect their primary intent."
    realtime:
      instructions:
        - "Greet the caller warmly."
        - "If `CallerFullName` is already present in the Collected Information, address them by first name directly — do NOT ask again."
        - "Otherwise, ask the caller for their first and last name. Once they have clearly stated both, call the record-caller-name tool exactly once with the spoken values. After the tool returns success, thank them by first name."
        - "Then listen for the caller's intent: balance, activate card, or agent transfer. Don't ask for PINs or codes yourself — picking an intent will trigger any verification automatically."
      examples:
        - "Welcome to ACME Bank. Before we get started, could I get your first and last name?"
        - "Thanks, Jordan. I can help you check your balance, activate a card, or transfer to a representative — what would you like to do?"
      tools:
        - record-caller-name
    scripted:
      dtmf:
        ssmlPrompt: |
          <speak version="1.0" xmlns="http://www.w3.org/2001/10/synthesis" xml:lang="en-US">
            <voice name="en-US-Ava:DragonHDLatestNeural">
              <prosody rate="-5%">
                Welcome to ACME Bank.
                <break time="300ms"/>
                For account balance, press 1.
                <break time="200ms"/>
                To activate a card, press 2.
                <break time="200ms"/>
                To speak with an agent, press 0.
              </prosody>
            </voice>
          </speak>
        options:
          - { digit: '1', label: balance,        nextStage: balance,        requires: [{ type: auth, level: multiFactor }] }
          - { digit: '2', label: activate-card,  nextStage: activate_card,  requires: [{ type: auth, level: knowledgeBased }] }
          - { digit: '0', label: agent,          nextStage: transfer }
    exitWhen: "Caller has stated their primary intent"
    transitions:
      - to: balance
        onCondition: "Caller wants to hear their account balance"
        requires:
          - type: auth
            level: multiFactor
      - to: activate_card
        onCondition: "Caller wants to activate a card"
        requires:
          - type: auth
            level: knowledgeBased
      - to: transfer
        onCondition: "Caller asked for an agent"

  - id: balance
    goal: "Read the verified caller their current account balance."
    description: "Verified balance self-service (requires MFA)"
    requires:
      - type: auth
        level: multiFactor
        message: "Balance access requires multi-factor verification."
    realtime:
      instructions:
        - "Caller is fully verified at this point."
        - "Call lookup-balance and read back the available and pending amounts in a natural sentence (e.g. \"Your available balance is $8,421.33 with $125 pending\")."
        - "When they're done, ask if there's anything else; if not, hand off to closing."
      tools:
        - lookup-balance
    exitWhen: "Caller has heard their balance and has no more questions"
    onExit: closing

  - id: activate_card
    goal: "Activate the caller's card after PIN verification."
    description: "Card activation (requires KBA)"
    requires:
      - type: auth
        level: knowledgeBased
        message: "Card activation requires PIN verification."
    realtime:
      instructions:
        - "Caller is PIN-verified at this point."
        - "Confirm the last four digits of the card the caller wants to activate."
        - "For this showcase there is no real backend; politely confirm activation and ask if anything else is needed."
        - "When they're done, hand off to closing."
    exitWhen: "Card activation acknowledged and caller has no more questions"
    onExit: closing

  - id: transfer
    goal: "Transfer the caller to a live agent."
    description: "Agent transfer"
    realtime:
      instructions:
        - "Acknowledge the request, set expectations on wait time, and complete the transfer."
        - "Use the transfer-to-agent tool with targetIdentifier set to the configured escalation number and transferKind 'phone'."
      tools:
        - transfer-to-agent
    exitWhen: "Transfer initiated"
    onExit: closing

  - import:
      stage: subflows.closing
      as: closing

