name: subflows.closing
version: 1
description: |
  Reusable leaf "closing" stage. Intended for import via the Phase 2 stage-import
  mechanism (`- import: { stage: subflows.closing, as: closing }`), not as a
  subflow push — the only stage is terminal with no outbound transitions, so the
  parent workflow inlines it at compile time and runs it directly.

base:
  prompt:
    role:
      identity: "Closing handler"
      objective: "Politely end the call after the caller's request has been resolved."
    personality:
      personality: "courteous, concise"
      tone: "warm"

stages:
  - id: closing
    goal: "Summarize what was accomplished and end the call."
    description: "Polite closing"
    terminal: true
    realtime:
      instructions:
        - "Briefly acknowledge what was accomplished on the call."
        - "Thank the caller by first name if `CallerFirstName` is present in Collected Information."
        - "Wish them a good day and end the call."
      examples:
        - "Thanks for calling ACME Bank, Jordan. Have a great day."
