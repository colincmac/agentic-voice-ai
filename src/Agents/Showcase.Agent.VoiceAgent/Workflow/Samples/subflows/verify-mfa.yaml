name: subflows.verify-mfa
version: 1
description: |
  Reusable second-factor sub-workflow. Pushed by an authResolver detour whenever a
  parent transition requires `auth: multiFactor`. The single OTP-collection stage
  itself declares `requires: auth: knowledgeBased`, so when a caller starts at
  `AniMatch` the navigator will recursively detour through `subflows.verify` (PIN)
  before running this OTP step — chained MFA elevation falls out of the auth-resolver
  re-evaluation in `PopFrameAsync` without any explicit YAML chaining.

strategy:
  primary: realtime
  fallback:
    - nlu
    - dtmf
  allowMidCallDegradation: true

base:
  prompt:
    role:
      identity: "Identity verification agent (MFA second factor)"
      objective: "Send a one-time SMS code and validate the caller's response to elevate to multi-factor verification."
    personality:
      personality: "calm, direct, security-aware"
      tone: "professional and reassuring"

stages:
  - id: collect_otp
    goal: "Issue an SMS one-time code, then validate the digits the caller reads back."
    description: "SMS OTP verification"
    requires:
      - type: auth
        level: knowledgeBased
        message: "PIN verification must complete before sending an OTP."
    realtime:
      instructions:
        - "Tell the caller you are sending a six-digit code to the phone number on file."
        - "Call request-otp exactly once to dispatch the SMS."
        - "When the caller reads the digits back, call submit-otp with just the digits — do not invent or guess."
        - "On failure, allow one retry, then transition to failed."
      tools:
        - request-otp
        - submit-otp
    scripted:
      onErrorPrompt: "That code doesn't match our records."
      dtmf:
        ssmlPrompt: |
          <speak version="1.0" xmlns="http://www.w3.org/2001/10/synthesis" xml:lang="en-US">
            <voice name="en-US-Ava:DragonHDLatestNeural">
              A six-digit code has been sent to your phone. Enter it followed by the pound key.
            </voice>
          </speak>
        collect:
          minDigits: 6
          maxDigits: 6
          terminator: '#'
          validator: submit-otp
          digitsParameterName: digits
          collectedStateKey: otpVerified
          onValidNextStage: verified
          onInvalidPrompt: "That code doesn't match our records."
    exitWhen: "OTP confirmed or all attempts exhausted"
    transitions:
      - to: verified
        onCondition: "OTP confirmed"
      - to: failed
        onCondition: "OTP could not be confirmed"

  - id: verified
    goal: "Signal successful MFA elevation."
    description: "MFA verification succeeded"
    terminal: true
    terminalOutcome: success
    realtime:
      instructions:
        - "Briefly acknowledge: 'Thanks, you're fully verified. One moment.'"

  - id: failed
    goal: "Signal that MFA could not be completed."
    description: "MFA verification failed"
    terminal: true
    terminalOutcome: failure
    realtime:
      instructions:
        - "Tell the caller you weren't able to verify them and that you'll connect them with someone who can help."
