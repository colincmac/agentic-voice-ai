name: subflows.verify
version: 1
description: |
  Reusable PIN-verification sub-workflow. Pushed by any parent workflow that needs
  the caller elevated to KnowledgeBased via the host-registered `confirm-identity`
  tool. Terminates with `terminalOutcome: success` when the PIN matches and
  `terminalOutcome: failure` when the caller can't be verified — the parent
  navigator routes those to its `onSuccess` / `onFailure` resume targets.

strategy:
  primary: realtime
  fallback:
    - nlu
    - dtmf
  allowMidCallDegradation: true

base:
  prompt:
    role:
      identity: "Identity verification agent"
      objective: "Verify the caller's identity by confirming their PIN."
    personality:
      personality: "calm, direct, security-aware"
      tone: "professional and reassuring"
    context: "If the conversation context has a CallerName, address them by first name."

stages:
  - id: ask_pin
    goal: "Collect and verify the caller's PIN."
    description: "PIN verification (knowledge factor)"
    realtime:
      instructions:
        - "Politely ask the caller to say their four-digit PIN."
        - "When they say it, call the confirm-identity tool with the digits."
        - "On a successful confirm-identity response, briefly acknowledge ('Verified, thank you.') and transition to verified."
        - "On a failed response, ask once more. If that fails too, transition to failed."
      tools:
        - confirm-identity
    scripted:
      onErrorPrompt: "That PIN doesn't match our records."
      dtmf:
        ssmlPrompt: |
          <speak version="1.0" xmlns="http://www.w3.org/2001/10/synthesis" xml:lang="en-US">
            <voice name="en-US-Ava:DragonHDLatestNeural">
              Please enter your four-digit PIN, followed by the pound key.
            </voice>
          </speak>
        collect:
          minDigits: 4
          maxDigits: 4
          terminator: '#'
          validator: pin-validator
          digitsParameterName: digits
          collectedStateKey: pinVerified
          onValidNextStage: verified
          onInvalidPrompt: "That PIN doesn't match our records."
    exitWhen: "PIN confirmed or all attempts exhausted"
    transitions:
      - to: verified
        onCondition: "PIN confirmed"
      - to: failed
        onCondition: "PIN could not be confirmed"

  - id: verified
    goal: "Signal successful identity verification."
    description: "Verification succeeded"
    terminal: true
    terminalOutcome: success
    realtime:
      instructions:
        - "Briefly acknowledge: 'You're verified. One moment.'"

  - id: failed
    goal: "Signal that identity could not be verified."
    description: "Verification failed"
    terminal: true
    terminalOutcome: failure
    realtime:
      instructions:
        - "Tell the caller you weren't able to verify them and that you'll connect them with someone who can help."
