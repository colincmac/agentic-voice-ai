id: authenticated-realtime-bank
version: 1
description: |
  Voice-first ACME Bank concierge demonstrating per-transition requirements (`requires:`) +
  `onBlocked:` edges in the new self-contained YAML schema. The welcome stage offers
  three options -- balance (needs MFA), activate-card (needs KBA / PIN), and transfer.
  When a guarded transition fails, the navigator routes to the inline `verify` /
  `verify-mfa` stages — there are no subflows or imports.

basePrompt: |
  You are the ACME Bank concierge agent. Help callers with account inquiries after
  verifying identity. Address the caller by first name once their name is captured.
  When you've satisfied the caller's intent, call `advance` with the matching label.

commonTools:
  - transfer_to_agent
  - hang_up_call

initialStage: welcome

stages:
  - id: welcome
    goal: Greet the caller, capture their name, and collect their primary intent.
    exitWhen: Caller has stated their primary intent.
    realtime:
      instructions:
        - Greet the caller warmly.
        - Ask for their first and last name; once given, call `record_caller_name` once.
        - Listen for the caller's intent. Don't ask for PINs or codes yourself — picking an intent triggers verification automatically.
      examples:
        - "Welcome to ACME Bank. Before we get started, could I get your first and last name?"
        - "Thanks, Jordan. I can help you check your balance, activate a card, or transfer to a representative — what would you like to do?"
      tools:
        - record_caller_name
    scripted:
      ssml: |
        <speak version="1.0" xmlns="http://www.w3.org/2001/10/synthesis" xml:lang="en-US">
          <voice name="en-US-Ava:DragonHDLatestNeural">
            <prosody rate="-5%">
              Welcome to ACME Bank.
              <break time="300ms"/>
              For account balance, press 1.
              <break time="200ms"/>
              To activate a card, press 2.
              <break time="200ms"/>
              To speak with an agent, press 0.
            </prosody>
          </voice>
        </speak>
      menu:
        '1': { label: balance,       transition: balance }
        '2': { label: activate-card, transition: activate_card }
        '0': { label: agent,         transition: transfer }
    nlu:
      instructions: Classify the caller's intent for the welcome menu.
      intents:
        - { name: get_balance,    description: Caller wants account balance,  transition: balance }
        - { name: activate_card,  description: Caller wants to activate a card, transition: activate-card }
        - { name: transfer,       description: Caller wants a live agent,     transition: agent }
    transitions:
      - to: balance
        label: balance
        when: Caller wants to hear their balance.
        requires:
          - { type: auth, level: multiFactor, message: "Balance access requires multi-factor verification." }
        onBlocked: verify-mfa
      - to: activate_card
        label: activate-card
        when: Caller wants to activate a card.
        requires:
          - { type: auth, level: knowledgeBased, message: "Card activation requires PIN verification." }
        onBlocked: verify
      - to: transfer
        label: agent
        when: Caller asked for an agent.

  - id: verify
    goal: Collect a 4-digit PIN to elevate the caller to knowledge-based verification.
    exitWhen: Caller has been verified at KBA level.
    realtime:
      instructions:
        - Ask the caller for their PIN.
        - When the caller provides it, call `validate-pin` to verify.
        - On success, call `advance` with target `verified`.
        - On failure, call `advance` with target `failed` after three attempts.
      tools:
        - validate-pin
    transitions:
      - to: balance
        label: verified
        when: PIN verification succeeded and the original intent was balance.
        requires:
          - { type: auth, level: knowledgeBased }
      - to: transfer
        label: failed
        when: PIN verification failed too many times.

  - id: verify-mfa
    goal: Collect an OTP code to elevate the caller to multi-factor verification.
    exitWhen: Caller has been verified at MFA level.
    realtime:
      instructions:
        - First ensure the caller is PIN-verified. If not, call `validate-pin`.
        - Ask the caller to enter the 6-digit OTP code sent to their phone.
        - Call `submit-otp` to verify. On success, call `advance` with target `verified`.
      tools:
        - validate-pin
        - request-otp
        - submit-otp
    transitions:
      - to: balance
        label: verified
        when: OTP verification succeeded.
        requires:
          - { type: auth, level: multiFactor }
      - to: transfer
        label: failed
        when: OTP verification failed too many times.

  - id: balance
    goal: Read the verified caller their current account balance.
    description: Verified balance self-service (requires MFA).
    exitWhen: Caller has heard their balance and has no more questions.
    realtime:
      instructions:
        - The caller is fully verified at this point.
        - Call `lookup-balance` and read back the available and pending amounts in a natural sentence.
        - When the caller is done, call `advance` with target `done`.
      tools:
        - lookup-balance
    transitions:
      - to: closing
        label: done

  - id: activate_card
    goal: Activate the caller's card after PIN verification.
    description: Card activation (requires KBA).
    exitWhen: Card activation acknowledged and caller has no more questions.
    realtime:
      instructions:
        - The caller is PIN-verified at this point.
        - Confirm the last four digits of the card the caller wants to activate.
        - For this showcase there is no real backend; politely confirm activation.
        - When the caller is done, call `advance` with target `done`.
    transitions:
      - to: closing
        label: done

  - id: transfer
    goal: Transfer the caller to a live agent.
    realtime:
      instructions:
        - Acknowledge the request, set expectations on wait time, and complete the transfer.
        - Use `transfer_to_agent` with the configured escalation number.
      tools:
        - transfer_to_agent
    terminal: true
    terminalOutcome: escalated

  - id: closing
    goal: Thank the caller and end the session.
    realtime:
      instructions:
        - Thank the caller by first name and end the call politely.
        - Call `hang_up_call` to terminate.
    terminal: true
    terminalOutcome: success
