name: Trigger auto deployment for wdg-voice-biometrics

# When this action will be executed
on:
  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.WDGVOICEBIOMETRICS_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.WDGVOICEBIOMETRICS_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.WDGVOICEBIOMETRICS_AZURE_SUBSCRIPTION_ID }}
          
      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/src/python-services/voice-biometrics
          dockerfilePath: Dockerfile
          acrName: ${{ secrets.WDGVOICEBIOMETRICS_AZURE_ACR_NAME }}
          containerAppName: ${{ secrets.WDGVOICEBIOMETRICS_AZURE_ACA_NAME }}
          resourceGroup: ${{ secrets.WDGVOICEBIOMETRICS_AZURE_RESOURCE_GROUP }}
          imageToBuild: ${{ secrets.WDGVOICEBIOMETRICS_AZURE_ACR_NAME }}.azurecr.io/voice-biometrics-api:${{ github.sha }}


